name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Fyne GUI (cmd/ferryman) の cgo ビルドに必要なネイティブ依存
      # go-gl/glfw v3.4 はタグ指定なしだと X11 と Wayland の両方をコンパイルするため
      # xorg-dev に加えて Wayland 側 (libwayland-dev, libxkbcommon-dev) も必要
      - run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
      - run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needs to be run on:"; echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  # NOTICES.txt は依存のライセンス本文をバイナリに載せるための生成物で、dependabot の
  # bump のたびに中身が変わる。落として人間に再生成させるのではなく、CI が生成して
  # PR ブランチにコミットを積む。
  #
  # test と分けてあるのは push 権限の範囲を絞るため。ここに混ぜると GUI をビルドして
  # テストを走らせるジョブ全体が書き込みトークンを持つことになる。gen-licenses.sh は
  # go list しか呼ばずコンパイルしないので、cgo もネイティブ依存も要らない。
  notices:
    runs-on: ubuntu-latest
    permissions:
      contents: write # PR ブランチへ push する
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pull_request の既定はマージコミットの detached HEAD で、push し返せない。
          # 同一リポジトリの PR のときだけブランチ本体を取る。fork の PR では
          # head_ref はこのリポジトリに存在せず、そもそもトークンが read-only。
          # push イベントでは pull_request が null なので既定 (空) に落ちる
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || '' }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Regenerate cmd/ferryman/NOTICES.txt
        env:
          # push し返せるのは同一リポジトリの PR のときだけ。それ以外 (fork の PR、
          # main への push) は従来どおり落とす。PR 経由でしか main に入らない限り
          # main が古くなることはないので、そちらが鳴ったら前提が壊れている
          PUSHABLE: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          script/gen-licenses.sh
          if git diff --quiet cmd/ferryman/NOTICES.txt; then
            echo "cmd/ferryman/NOTICES.txt is up to date"
            exit 0
          fi
          if [ "${PUSHABLE}" != "true" ]; then
            git diff cmd/ferryman/NOTICES.txt
            echo "run script/gen-licenses.sh and commit the result" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -F - cmd/ferryman/NOTICES.txt <<'MSG'
          license: regenerate NOTICES.txt

          Dependencies changed. Regenerated by script/gen-licenses.sh in CI.
          MSG
          # GITHUB_TOKEN での push は新しい run を発火しないので、これで止まる
          git push
