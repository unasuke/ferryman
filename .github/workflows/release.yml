name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.3 / v1.2.3-rc.1)"
        required: true
        type: string

permissions:
  contents: read

# 同一 tag のリリースが二重に走らないようにする（先行を優先し後発を待たせる）
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # go-gl/glfw v3.4 はタグ指定なしだと X11 と Wayland の両方をコンパイルするため
      # xorg-dev に加えて Wayland 側 (libwayland-dev, libxkbcommon-dev) も必要
      - if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev
      # GUI (cgo, native). Windows は windowsgui サブシステムでコンソール窓を抑制
      # 出力名は Release アセット名そのもの（ferryman_<tag>_<goos>_<goarch>[.exe]）
      - shell: bash
        env:
          VERSION: ${{ inputs.tag }}
          SUFFIX: ${{ inputs.tag }}_${{ matrix.goos }}_${{ matrix.goarch }}
        run: |
          mkdir -p dist
          ext=""; ldflags="-X main.version=${VERSION}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            ext=".exe"; ldflags="-H windowsgui ${ldflags}"
          fi
          # -v はコンパイル中のパッケージ名を流す。cgo で glfw をビルドする
          # Windows は無出力の時間が長く、ログ上で停止と区別が付かないため
          go build -v -ldflags "${ldflags}" -o "dist/ferryman_${SUFFIX}${ext}" ./cmd/ferryman
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ferryman-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag と Release の作成に必要
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      # tag 形式を検証（v1.2.3 / v1.2.3-rc.1 等）し、既存 tag/Release を明確に弾く
      - run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid tag: $TAG (expected vMAJOR.MINOR.PATCH[-prerelease])"; exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"; exit 1
          fi
          if gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"; exit 1
          fi
      # ビルド時点でアセット名が付いているので、全 artifact を一つのディレクトリに畳むだけでよい
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: assets
          merge-multiple: true
      - run: ls -l assets
      # prerelease 判定（tag に "-" があれば prerelease）
      - run: |
          pre=""; [[ "$TAG" == *-* ]] && pre="--prerelease"
          gh release create "$TAG" assets/* \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes $pre
